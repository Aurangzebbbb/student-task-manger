<body>

    <main class="container">

        <!-- ================= HEADER ================= -->

        <header class="app-header">

            <p class="eyebrow">Student Productivity</p>

            <h1>Student Task Manager</h1>

            <p class="subtitle">
                Add, search, complete, and remove your tasks.
            </p>

        </header>


        <!-- ================= ADD TASK SECTION ================= -->

        <section class="card">

            <h2>Add a Task</h2>

            <form id="taskForm">

                <div class="form-grid">

                    <!-- Task Name -->

                    <div class="field field-wide">

                        <label for="taskInput">
                            Task
                        </label>

                        <input
                            type="text"
                            id="taskInput"
                            placeholder="e.g. Complete Data Science assignment"
                            maxlength="120"
                            required
                        >

                    </div>


                    <!-- Priority -->

                    <div class="field">

                        <label for="priorityInput">
                            Priority
                        </label>

                        <select id="priorityInput">

                            <option value="low">
                                Low
                            </option>

                            <option value="medium" selected>
                                Medium
                            </option>

                            <option value="high">
                                High
                            </option>

                        </select>

                    </div>


                    <!-- Due Date -->

                    <div class="field">

                        <label for="dateInput">
                            Due Date
                        </label>

                        <input
                            type="date"
                            id="dateInput"
                        >

                    </div>

                </div>


                <button
                    class="primary-btn"
                    type="submit"
                >
                    Add Task
                </button>

            </form>

        </section>


        <!-- ================= TASK SECTION ================= -->

        <section class="card">

            <div class="tasks-toolbar">

                <div>

                    <h2>My Tasks</h2>

                    <p
                        id="taskCount"
                        class="task-count"
                    >
                        0 tasks
                    </p>

                </div>


                <!-- Search -->

                <div class="search-wrap">

                    <label
                        class="sr-only"
                        for="searchInput"
                    >
                        Search tasks
                    </label>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search tasks..."
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- ================= FILTERS ================= -->

            <div
                class="filters"
                role="group"
                aria-label="Task filters"
            >

                <button
                    class="filter-btn active"
                    type="button"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    type="button"
                    data-filter="active"
                >
                    Active
                </button>

                <button
                    class="filter-btn"
                    type="button"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>


            <!-- ================= TASK LIST ================= -->

            <div
                id="taskList"
                class="task-list"
            >
            </div>


            <!-- Message when there are no tasks -->

            <p
                id="emptyState"
                class="empty-state"
            >
                No tasks yet. Add your first task above.
            </p>

        </section>

    </main>
